name: Probe price sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir out && cd out
          p() { code=$(curl -s -m 60 -A 'Mozilla/5.0' -o "$1" -w '%{http_code} %{size_download}' "$2"); echo "$1 $code" >> summary.txt; head -c 400 "$1" > "$1.head"; }
          for u in latest/buff163.json latests.json 2026/09/28/prices.json latest/steam.json; do
            f=$(echo $u | tr '/' '_')
            code=$(curl -s -m 120 --compressed -A 'Mozilla/5.0' -o "$f" -w '%{http_code} %{size_download}' "https://prices.csgotrader.app/$u"); echo "$u $code" >> summary.txt
            python3 - "$f" >> summary.txt <<'PY' || head -c 300 "$f" >> summary.txt
          import json,sys,gzip
          raw=open(sys.argv[1],'rb').read()
          if raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
          d=json.loads(raw)
          print(sys.argv[1], type(d).__name__, len(d))
          if isinstance(d,dict):
            for k in ['AK-47 | Redline (Field-Tested)','★ Karambit | Doppler (Factory New)','Souvenir AWP | Dragon Lore (Factory New)']:
              print(' ',k, json.dumps(d.get(k))[:900])
            print('  keys sample', list(d)[:3])
          PY
            rm -f "$f"
          done
          git init -q -b probe && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
