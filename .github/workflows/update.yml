name: Deploy site

# Цены собирает VPS (scripts/vps-run.sh): он кладёт состояние в ветку `data`
# и вызывает этот workflow через repository_dispatch. Здесь только сборка и публикация сайта.

on:
  repository_dispatch:
    types: [state-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/update.mjs', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore state (ветка data)
        run: |
          git clone --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" state || mkdir -p state

      - name: Build site data
        env:
          STATE_DIR: state
          OUT_DIR: site/data
          BUILD: ${{ github.sha }}
        run: |
          node scripts/update.mjs --render
          # версия в адресах файлов, чтобы браузер и приложение с главного экрана не держали старый код
          v=${BUILD::8}
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|; s|href=\"style.css\"|href=\"style.css?v=$v\"|" site/index.html
          grep -q "app.js?v=$v" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
