name: Update prices

# Раз в 10 часов собирает цены с площадок (scripts/collect.mjs) и публикует сайт на GitHub Pages.
# Цены Steam (и Market.CSGO — он не пускает серверы GitHub) собирает VPS и кладёт в ветку `steam`.
# Расписание GitHub не умеет «каждые 10 часов», поэтому workflow просыпается каждый час
# и работает, только если с прошлого обновления прошло ~10 часов.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then echo run=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
          t=$(curl -fsS "https://${owner,,}.github.io/${repo}/data/meta.json?x=$RANDOM" | jq -r '.updatedAt // 0' || echo 0)
          age=$(( $(date +%s) - ${t:-0} / 1000 ))
          echo "с прошлого обновления: $((age / 60)) мин"
          # полчаса запаса: GitHub запускает расписание с опозданием
          if [ "$age" -ge $((10 * 3600 - 30 * 60)) ]; then echo run=1; else echo run=0; fi >> "$GITHUB_OUTPUT"

  deploy:
    needs: due
    if: needs.due.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # справочник предметов (картинки, типы) — скачивается раз в сутки
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: refs-${{ steps.day.outputs.day }}
          restore-keys: refs-

      - name: Steam prices from VPS (ветка steam)
        run: git clone --depth 1 --branch steam "https://github.com/${GITHUB_REPOSITORY}.git" steam || mkdir -p steam

      - name: Collect prices
        env:
          STEAM_DIR: steam
          OUT_DIR: site/data
          CACHE_DIR: .cache
          BUILD: ${{ github.sha }}
        run: |
          node scripts/collect.mjs
          # версия в адресах файлов, чтобы браузер и приложение с главного экрана не держали старый код
          v=${BUILD::8}
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|; s|href=\"style.css\"|href=\"style.css?v=$v\"|" site/index.html
          grep -q "app.js?v=$v" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
