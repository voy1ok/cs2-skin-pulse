name: Deploy site

# Цены Steam собирает VPS (scripts/vps-run.sh): он кладёт состояние в ветку `data`
# и вызывает этот workflow через repository_dispatch.
# Рынок Skinport (все предметы, топы) снимается здесь по расписанию каждые 5 минут:
# с VPS Skinport не пускает. Его состояние лежит в отдельной ветке `market`.

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [state-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/update.mjs', '.github/workflows/**']

permissions:
  contents: write # push в ветку market
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false # не обрывать снимок рынка на середине

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore state (ветка data)
        run: |
          git clone --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" state || mkdir -p state
          git clone --depth 1 --branch market "https://github.com/${GITHUB_REPOSITORY}.git" market || mkdir -p market
          rm -rf market/.git

      - name: Snapshot Skinport
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          STATE_DIR: market
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update.mjs --market
          cd market
          git init -q -b market
          git add -A
          git -c user.name=skin-pulse-bot -c user.email=skin-pulse-bot@users.noreply.github.com commit -qm "market $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" market
          rm -rf .git

      - name: Merge market state
        run: cp market/*.json.gz state/ 2>/dev/null || true

      # картинки и типы наклеек, агентов, кейсов… — скачиваются раз в сутки
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: extras-${{ steps.day.outputs.day }}
          restore-keys: extras-

      - name: Build site data
        env:
          EXTRAS_CACHE: .cache/extras.json.gz
          STATE_DIR: state
          OUT_DIR: site/data
          BUILD: ${{ github.sha }}
        run: |
          node scripts/update.mjs --render
          # версия в адресах файлов, чтобы браузер и приложение с главного экрана не держали старый код
          v=${BUILD::8}
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|; s|href=\"style.css\"|href=\"style.css?v=$v\"|" site/index.html
          grep -q "app.js?v=$v" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
